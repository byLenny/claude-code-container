[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

; XML-RPC interface, localhost-only, used by the web UI to read process status
[inet_http_server]
port=127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=http://127.0.0.1:9001

; --- Always-on programs ---------------------------------------------------

[program:webui]
command=python3 /opt/webui/app.py
directory=/opt/webui
user=dev
autostart=true
autorestart=true
environment=HOME="/home/dev"
stdout_logfile=/var/log/claude-sessions/webui.log
stderr_logfile=/var/log/claude-sessions/webui.log

; --- Per-repo Remote Control sessions --------------------------------------
; entrypoint.sh generates one [program:claude-<repo>] block per /workspace
; subfolder into this directory at container start, then supervisord loads
; whatever it finds here.
[include]
files = /etc/supervisor/generated/*.conf
