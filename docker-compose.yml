services:
  claude-dev:
    build: .
    container_name: claude-dev
    hostname: claude-dev
    restart: unless-stopped
    environment:
      # Personal access token (repo scope) for cloning/pushing repos you
      # have access to — see .env.example. Optional: leave unset and only
      # public repos over https will work.
      - GH_TOKEN=${GH_TOKEN:-}
      # Shared secret for the browser-based terminal AND the web
      # dashboard's HTTP Basic Auth (username 'dev') — see .env.example.
      # Optional: leave unset to disable the terminal and leave the
      # dashboard unauthenticated; `docker exec -it claude-dev sudo -u
      # dev claude` always works either way.
      - TTYD_TOKEN=${TTYD_TOKEN:-}
    ports:
      # Web UI: session list, QR codes, and controls (clone/start/stop
      # sessions) -- gated by TTYD_TOKEN above when it's set. Put this
      # behind Caddy/Tailscale, don't expose it to the open internet.
      - "127.0.0.1:8811:8080"
      # Browser login terminal (only listens if TTYD_TOKEN is set above).
      # Same rule: keep it on 127.0.0.1, don't expose it directly.
      - "127.0.0.1:7681:7681"
    volumes:
      - ./workspace:/workspace
      - claude-config:/home/dev/.claude          # login + settings persist here
      - claude-npm-cache:/home/dev/.npm
      - claude-pip-cache:/home/dev/.cache/pip
      - claude-gradle-cache:/home/dev/.gradle     # wrapper distributions + deps
      - claude-maven-cache:/home/dev/.m2          # local repo (wrapper or mvn)
      - ./supervisor.d:/etc/supervisor/generated  # generated per-repo programs

volumes:
  claude-config:
  claude-npm-cache:
  claude-pip-cache:
  claude-gradle-cache:
  claude-maven-cache:
